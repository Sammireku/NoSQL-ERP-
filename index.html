    <script>
      // Gracefully prevent injected browser extensions (e.g. MetaMask inpage provider) from throwing unhandled errors in sandboxed preview iframes
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (reason) {
          var text = typeof reason === 'string' ? reason : (reason.message || '') + (reason.stack || '');
          if (text.indexOf('MetaMask') !== -1 || text.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 || text.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      }, true);

      window.addEventListener('error', function(event) {
        var src = (event.filename || '') + (event.message || '');
        if (event.error && event.error.stack) src += event.error.stack;
        if (src.indexOf('MetaMask') !== -1 || src.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 || src.indexOf('chrome-extension://') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
